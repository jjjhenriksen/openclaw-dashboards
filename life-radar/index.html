<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {
  color-scheme: dark;
  --ink: #f4eee7;
  --muted: #9f9690;
  --line: rgba(255,255,255,.13);
  --red: #ee3d2f;
  --gold: #f3b33d;
  --black: #090a0c;
}
* { box-sizing: border-box; }
html, body { margin:0; min-height:100%; background:var(--black); }
body {
  overflow:hidden;
  font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
  color:var(--ink);
}
.hero {
  position:relative;
  min-height:100%;
  overflow:hidden;
  display:flex;
  align-items:center;
  padding:26px 30px;
  border:1px solid var(--line);
  border-radius:16px;
  background:
    radial-gradient(circle at 88% 18%, rgba(238,61,47,.22), transparent 25%),
    radial-gradient(circle at 75% 88%, rgba(243,179,61,.11), transparent 23%),
    linear-gradient(135deg, #0b0c0f 0%, #111214 58%, #160d0d 100%);
}
.hero::after {
  content:"";
  position:absolute;
  inset:12px;
  border:1px solid rgba(238,61,47,.18);
  border-radius:11px;
  pointer-events:none;
}
.copy { position:relative; z-index:2; max-width:65%; }
.kicker {
  margin:0 0 11px;
  color:var(--gold);
  font-size:12px;
  letter-spacing:.18em;
  font-weight:700;
}
h1 {
  margin:0;
  color:#fff8f1;
  font-size:clamp(28px, 5vw, 48px);
  line-height:1;
  letter-spacing:-.06em;
  font-weight:800;
}
.rule {
  width:92px;
  height:3px;
  margin:18px 0 15px;
  background:linear-gradient(90deg,var(--red),var(--gold));
  border-radius:999px;
}
.sub {
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  letter-spacing:.04em;
}
.badge {
  display:inline-flex;
  gap:8px;
  align-items:center;
  margin-top:18px;
  padding:7px 10px;
  border:1px solid rgba(238,61,47,.4);
  border-radius:999px;
  color:#ffd1c7;
  background:rgba(238,61,47,.08);
  font-size:11px;
  letter-spacing:.08em;
}
.dot {
  width:7px; height:7px; border-radius:50%;
  background:var(--red);
  box-shadow:0 0 14px rgba(238,61,47,.8);
}
.mascot {
  position:absolute;
  z-index:1;
  right:3%;
  bottom:-4%;
  width:min(31%, 230px);
  height:auto;
  object-fit:contain;
  filter:drop-shadow(0 14px 18px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(238,61,47,.22));
  user-select:none;
  pointer-events:none;
}
.corner {
  position:absolute;
  right:25px;
  top:22px;
  color:rgba(255,255,255,.35);
  font-size:10px;
  letter-spacing:.12em;
}
@media (max-width:520px) {
  .hero { padding:22px; }
  .copy { max-width:72%; }
  .mascot { right:-5%; width:36%; opacity:.9; }
  .corner { right:18px; top:17px; }
}
</style><style>.mascot-placeholder{display:grid;place-items:center;width:92px;height:92px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);font:700 12px var(--font-mono,ui-monospace,monospace);letter-spacing:.12em}</style>
</head>
<body>
  <section class="hero" aria-label="Life Radar">
    <div class="copy">
      <p class="kicker">OPENCLAW // LIFE SYSTEM</p>
      <h1>Life Radar</h1>
      <div class="rule"></div>
      <p class="sub">A clear field for deadlines, capacity, and what matters next.</p>
      <div class="badge"><span class="dot" aria-hidden="true"></span> STATIC SNAPSHOT // 09 SEP 2026</div>
    </div>
    <div class="corner">RENDERED CANVAS SURFACE</div>
    <div class="mascot-placeholder" role="img" aria-label="Red and gold lobster mascot">OPENCLAW</div>
  </section>
<p style="margin:14px 0 0;color:var(--muted);font:11px var(--font-mono,ui-monospace,monospace);">Static public export · rendered from the Sep 9, 2026 Life Radar canvas artifact · no live connections.</p></body></html>
